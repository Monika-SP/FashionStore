<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Fashion Store{% endblock %}</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <a href="{% url 'home' %}" class="logo">
    Fashion<span>Store</span>
</a>

        <nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'shop' %}">Shop</a>
    <a href="{% url 'my_orders' %}">My Orders</a>
    <a href="#">Collections</a>
    <a href="#">About</a>
</nav>

        <div class="nav-actions">

    <a href="#" title="Search">⌕</a>

    <a href="{% url 'cart' %}" title="Shopping Cart">
        🛒
    </a>

    <a href="{% url 'profile' %}" title="My Profile">
        ♙
    </a>

    {% if user.is_authenticated %}

        <a href="{% url 'logout' %}" class="register-nav-link">
            Logout
        </a>

    {% else %}

        <a href="{% url 'register' %}" class="register-nav-link">
            Register
        </a>

    {% endif %}

</div>

    </header>


    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="footer">

        <div>
            <h2>FashionStore</h2>
            <p>Discover your style. Wear your confidence.</p>
        </div>

        <p>© 2026 FashionStore. All rights reserved.</p>

    </footer>

</body>
</html>
